<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos - Control de Acceso</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- css del dashboard -->
    <link rel="stylesheet" href="../../public/assets/css/nav.css">
    <link rel="stylesheet" href="../../public/assets/css/dashboard.css">
    <link rel="stylesheet" href="../../public/assets/css/escanear-qr.css">
</head>

<body>

    <!-- estructura general de la aplicación -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- navegación lateral compartida -->
        <aside id="navegacion-header-vigilante" class="contenedor-navegacion sticky-top vh-100">
        </aside>

        <!-- fondo oscuro para celulares -->
        <div id="fondo-menu" class="fondo-menu"></div>


        <!-- contenido derecho -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- encabezado superior -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <!-- botón del menú para celulares -->
                <button id="boton-menu"
                    class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3" type="button">

                    <i class="bi bi-list"></i>

                </button>

                <!-- información de la página -->
                <div class="informacion-pagina">

                    <h1 class="mb-1">Escanear QR</h1>

                    <p class="mb-0">Panel de Vigilancia</p>

                </div>

            </header>


            <!-- contenido principal -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section>
                    <header class="encabezado-escaner mb-4">
                        <h2 id="titulo-escanear-qr"> Escanear Código QR</h2>
                        <p>Escanea el QR del usuario para registrar ingreso o salida</p>
                    </header>

                    <div class="row g-4">

                        <div class="col-12 col-lg-7">
                            <article class="tarjeta-lector">

                                <div class="area-escaneo">
                                    <i class="bi bi-qr-code-scan"></i>
                                </div>

                                <h3>Apunta la cámara al código QR del usuario</h3>

                                <hr>

                                <p>Área de escaneo</p>
                            </article>
                        </div>

                        <div class="col-12 col-lg-5">
                            <article class="tarjeta-informacion">

                                <div class="icono-usuario">
                                    <i class="bi bi-person-fill"></i>
                                </div>

                                <p>Escanea o ingresa un código QR para
                                    ver la información del usuario</p>
                            </article>
                        </div>


                    </div>

                    <section class="codigo-manual">

                        <form class="formulario-codigo">

                            <div>
                                <label id="titulo-codigo-manual" for="codigo-usuario">Código del Usuario</label>

                                <input id="codigo-usuario" name="codigo-usuario" type="text"
                                    placeholder="Ingrese el código">
                            </div>

                            <button type="button">Ingresar</button>
                        </form>
                    </section>
                </section>

            </main>

            <!-- pie de página -->
            <footer class="pie-dashboard bg-white">

                <p>Sistema de Control de Acceso - SENA</p>

            </footer>

        </div>

    </div>

    <!-- archivo de navegación compartida -->
    <script src="../../public/assets/js/nav.js"></script>
    <script src="../../public/assets/js/barra.js"></script>

</body>

</html>
