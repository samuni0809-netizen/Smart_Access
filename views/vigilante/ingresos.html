<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos - Control de Acceso</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- css del dashboard -->
    <link rel="stylesheet" href="../../public/assets/css/nav.css">
    <link rel="stylesheet" href="../../public/assets/css/dashboard.css">
</head>

<body>

    <!-- estructura general de la aplicación -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- navegación lateral compartida -->
        <aside id="navegacion-header-vigilante"
            class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0">
        </aside>

        <div id="fondo-menu" class="fondo-menu"></div>

        <!-- contenido derecho -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- encabezado superior -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button
                    id="boton-menu" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3" type="button">

                    <i class="bi bi-list"></i>

                </button>

                <div class="informacion-pagina">

                    <h1 id="titulo-ingresos" class="mb-1">Ingresos</h1>

                    <p class="mb-0">Panel de Vigilancia</p>

                </div>

            </header>

            <!-- contenido principal del dashboard -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4 ">

                <!-- título del panel -->
                <section class="encabezado-dashboard mb-4">

                    <h2 id="titulo-panel-control" class="mb-1">
                        Historial de movimientos del día
                    </h2>

                    <p class="mb-0">
                        Miércoles, 11 de noviembre de 2026
                    </p>

                </section>

                <!-- panel general del historial -->
                <section class="panel-registros bg-white border rounded-4 p-3 p-md-4 mt-4">

                    <!-- tabla del historial -->
                    <div class="contenedor-tabla-registros table-responsive ">

                        <table class="tabla-registros table table-hover align-middle mb-0">

                            <thead class="table-light text-center">

                                <tr>

                                    <th class="text-nowrap" scope="col">Usuario</th>

                                    <th class="text-nowrap" scope="col">Documento</th>

                                    <th class="text-nowrap" scope="col">Movimiento</th>

                                    <th class="text-nowrap" scope="col">Fecha y hora</th>

                                    <th class="text-nowrap" scope="col">Computador (equipo y serial)</th>

                                    <th class="text-nowrap" scope="col">Vehículo (vehículo y placa)</th>

                                    <th class="text-nowrap" scope="col">Estado de elementos</th>

                                    <th class="text-nowrap" scope="col">Vigilante responsable</th>

                                </tr>

                            </thead>


                            <tbody>

                                <!-- registro de ejemplo tomado del historial administrativo -->
                                <tr>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

            <!-- pie de página -->
            <footer class="pie-dashboard bg-white">

                <p>Sistema de Control de Acceso - SENA</p>

            </footer>

        </div>

    </div>

    <!-- archivo de navegación compartida -->
    <script src="../../public/assets/js/nav.js"></script>
    <script src="../../public/assets/js/barra.js"></script>

</body>

</html>
