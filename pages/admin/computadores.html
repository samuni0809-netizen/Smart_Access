<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <!-- NAVEGACIÓN COMPARTIDA ENTRE PÁGINAS  -->

    <header>
        <div id="navegacion-header"></div>

        <div>
            <button>
                <p>Este es el boton para abrir la barra de navegacion</p>
            </button>
            <div>
                <h1>Computadores del sistema</h1>
                <p>Panel Administrativo</p>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
    <main>
        <article>
            <div>Activo</div>

            <div>
                <img src="#" alt="Imágen del computador">
            </div>

            <div>
                <h3>Marca del computador</h3>
                <span>Permanente</span>
            </div>

            <div>
                <p>Propietario: </p>

                <div>
                    <span>Serial</span>
                    <span>123345</span>
                </div>

                <p>Registro:  -  En istalaciones</p>
                <p>Descripción del computador</p>
            </div>

            <div>
                <button type="button">Ver</button>
                <button type="button">Editar</button>
            </div>
        </article>
    </main>
