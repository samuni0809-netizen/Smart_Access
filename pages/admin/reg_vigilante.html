<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vigilante - Control de Acceso</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- css del proyecto -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/registrar.css">
</head>

<body>
    <!-- estructura general -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- navegación lateral -->
        <aside id="navegacion-header" class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0">
        </aside>

        <div id="fondo-menu" class="fondo-menu"></div>

        <!-- contenido derecho -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- encabezado -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button
                    id="boton-menu" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3" type="button">

                    <i class="bi bi-list"></i>

                </button>

                <div class="informacion-pagina">
                    <h1 class="mb-1">Registrar Vigilante</h1>
                    <p class="mb-0">Panel Administrativo</p>
                </div>

            </header>

            <!-- contenido principal -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section>

                    <!-- tarjeta principal -->
                    <div class="card p-3 p-md-4">

                        <!-- formulario temporal -->
                        <form id="formulario-temporal">

                            <!-- registro de vigilante -->
                            <section class="mt-4">

                                <div class="row g-3">

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="nombre-completo">
                                            Nombre completo
                                        </label>
                                        <input id="nombre-completo" class="form-control"
                                            name="nombre completo" type="text" placeholder="Nombre completo">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="documento">
                                            Número de documento
                                        </label>
                                        <input id="documento" class="form-control" name="documento" type="text" placeholder="Número de documento">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="telefono">
                                            Teléfono
                                        </label>
                                        <input id="telefono" class="form-control"
                                            name="telefono" type="text" placeholder="Teléfono">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="correo">
                                            Correo electrónico

                                        </label>
                                        <input id="correo" class="form-control"
                                            name="correo" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            Turno
                                        </label>
                                        <select id="turno" class="form-select">
                                            <option value="">Selecciona una opción</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            Centro
                                        </label>
                                        <select id="centro" class="form-select">
                                            <option value="">Selecciona una opción</option>
                                        </select>
                                    </div>

                                </div>

                            </section>

                            <div class="mt-4">
                                <button class="btn btn-success px-4 boton-registrar" type="button">
                                    Registrar
                                </button>
                            </div>

                        </form>

                    </div>

                </section>

            </main>

            <!-- pie de página -->
            <footer class="pie-dashboard bg-white">
                <p>Sistema de Control de Acceso - SENA</p>
            </footer>

        </div>

    </div>

    <!-- archivos de navegación -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
