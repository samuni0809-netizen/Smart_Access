<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehículo - Control de Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/registrar.css">
</head>

<body>
    <!-- ESTRUCTURA GENERAL -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- NAVEGACIÓN LATERAL -->
        <aside id="navegacion-header" class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0"
            aria-label="Navegación principal">
        </aside>

        <div class="fondo-menu" id="fondo-menu"></div>

        <!-- CONTENIDO DERECHO -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- ENCABEZADO -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button type="button" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3"
                    id="boton-menu" aria-label="Abrir menú" aria-expanded="false">

                    <i class="bi bi-list" aria-hidden="true"></i>

                </button>

                <div class="informacion-pagina">
                    <h1 class="mb-1">Registrar Vehículo</h1>
                    <p class="mb-0">Panel Administrativo</p>
                </div>

            </header>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section>

                    <!-- TARJETA PRINCIPAL -->
                    <div class="card p-3 p-md-4">

                        <!-- FORMULARIO TEMPORAL -->
                        <form id="formulario-temporal" aria-label="Registro temporal">

                            <!-- REGISTRO DE VEHÍCULO -->
                            <section class="mt-4" aria-labelledby="titulo-vehiculo">

                                <div class="row g-3">

                                    <div class="col-12 col-md-6">
                                        <label for="nombre completo" class="form-label">
                                            Nombre completo
                                        </label>
                                        <input type="text" class="form-control" id="nombre completo"
                                            name="nombre completo" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="documento" class="form-label">
                                            Documento
                                        </label>
                                        <input type="text" class="form-control" id="documento" name="documento" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="telefono" class="form-label">
                                            Teléfono
                                        </label>
                                        <input type="text" class="form-control" id="telefono"
                                            name="telefono" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="correo" class="form-label">
                                            Correo electrónico

                                        </label>
                                        <input type="text" class="form-control" id="correo"
                                            name="correo" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            Turno
                                        </label>
                                        <select class="form-select" id="turno">
                                            <option value="">Selecciona una opción</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            Centro
                                        </label>
                                        <select class="form-select" id="centro">
                                            <option value="">Selecciona una opción</option>
                                        </select>
                                    </div>

                                </div>

                            </section>

                            <div class="mt-4">
                                <button type="button" class="btn btn-success px-4 boton-registrar">
                                    Registrar
                                </button>
                            </div>

                        </form>

                    </div>

                </section>

            </main>

            <!-- PIE DE PÁGINA -->
            <footer class="pie-dashboard bg-white">
                <p>Sistema de Control de Acceso - SENA</p>
            </footer>

        </div>

    </div>

    <!-- ARCHIVOS DE NAVEGACIÓN -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
