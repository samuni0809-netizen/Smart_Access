<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vigilante | Panel Administrativo - SENA </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del Dashboard -->
    <link rel="stylesheet" href="../../css/nav.css">
</head>

<body>

    <!-- NAVEGACIÓN COMPARTIDA ENTRE PÁGINAS  -->

    <header>
        <div id="navegacion-header"></div>

        <div>
            <button>
                <p>Este es el boton para abrir la barra de navegación</p>
            </button>
            <div>
                <h1>Registrar Vigilante</h1>
                <p>Panel Administrativo</p>
            </div>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->

    <main>
        <h2>Registrar Vigilante</h2>

        <form action="#">
            <div>
                <label>Nombre completo</label>
                <input type="text">
            </div>

            <div>
                <label>Documento</label>
                <input type="number">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="number">
            </div>

            <div>
                <label>Correo</label>
                <input type="email">
            </div>

            <div>
                <label>Contraseña</label>
                <input type="password" placeholder="Mínimo 6 caracteres">
            </div>

            <div>
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Mínimo 6 caracteres">
            </div>

            <div>
                <label>Centro</label>
                <select>
                    <Option>Selecione una opción</Option>
                </select>
            </div>

            <!-- BOTÓN DE ENVÍO -->
            <div>
                <button type="submit">Registrar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>información del footer</p>
    </footer>
</body>

<!-- ENLACES JS PARA EL FUNCIONAMIENTO DE LA PÁGINA -->

<script src="../../js/nav.js"></script>

</html>
