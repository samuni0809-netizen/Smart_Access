<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Portero | Panel Administrativo - SENA </title>
    <link rel="stylesheet" href="#">
</head>

<body>

    <!-- NAVEGACIÓN COMPARTIDA ENTRE PÁGINAS  -->

    <header>
        <div id="navegacion-header"></div>

        <div>
            <button>
                <p>Este es el boton para abrir la barra de navegacion</p>
            </button>
            <div>
                <h1>Registrar Portero</h1>
                <p>Panel Administrativo</p>
            </div>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->

    <main>
        <h2>Registrar Portero</h2>

        <form action="#">
            <div>
                <label>Nombre completo</label>
                <input type="text">
            </div>

            <div>
                <label>Documento</label>
                <input type="number">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="number">
            </div>

            <div>
                <label>Correo</label>
                <input type="email">
            </div>

            <div>
                <label>Contraseña</label>
                <input type="password" placeholder="Mínimo 6 caracteres">
            </div>

            <div>
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Mínimo 6 caracteres">
            </div>

            <div>
                <label>Centro</label>
                <select>
                    <Option>Selecione una opción</Option>
                </select>
            </div>

            <!-- BOTÓN DE ENVÍO -->
            <div>
                <button type="submit">Registrar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>informacion del footer</p>
    </footer>
</body>

<!-- ENLACES JS PARA EL FUNCIONAMIENTO DE LA PÁGINA -->

<script src="../../js/nav.js"></script>

</html>
