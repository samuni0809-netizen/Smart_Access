<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehículo - Control de Acceso</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- css del proyecto -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/registrar.css">
</head>

<body>
    <!-- estructura general -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- navegación lateral -->
        <aside id="navegacion-header-vigilante" class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0"
            aria-label="Navegación principal">
        </aside>

        <div id="fondo-menu" class="fondo-menu"></div>

        <!-- contenido derecho -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- encabezado -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button
                    id="boton-menu" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3" type="button" aria-label="Abrir menú" aria-expanded="false">

                    <i class="bi bi-list" aria-hidden="true"></i>

                </button>

                <div class="informacion-pagina">
                    <h1 id="titulo-registro" class="mb-1">Registrar Vehículo</h1>
                    <p class="mb-0">Panel de Vigilancia</p>
                </div>

            </header>

            <!-- contenido principal -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section>

                    <!-- tarjeta principal -->
                    <div class="card p-3 p-md-4">

                        <!-- formulario temporal -->
                        <form id="formulario-temporal" aria-label="Registro temporal">

                            <!-- registro de vehículo -->
                            <section class="mt-4" aria-labelledby="titulo-registro">

                                <div class="row g-3">

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="documento-propietario">
                                            Número de documento del propietario
                                        </label>
                                        <input id="documento-propietario" class="form-control"
                                            name="documento-propietario" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="placa">
                                            Placa del vehículo
                                        </label>
                                        <input id="placa" class="form-control" name="placa" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="tipo-vehiculo">
                                            Tipo de vehículo
                                        </label>
                                        <select id="tipo-vehiculo" class="form-select" name="tipo de Vehículo">
                                            <option value="">Selecciona una opción</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="marca">
                                            Marca
                                        </label>
                                        <input id="marca" class="form-control"
                                            name="marca" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="modelo">
                                            Modelo
                                        </label>
                                        <input id="modelo" class="form-control"
                                            name="modelo" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="detalle-vehiculo">
                                            Observaciones
                                        </label>
                                        <input id="detalle-vehiculo" class="form-control"
                                            name="detalle-ehículo" type="text" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <div class="area-fotografia border rounded p-3 h-100 text-center">

                                            <div class="mb-2">
                                                <i class="bi bi-camera fs-2" aria-hidden="true"></i>
                                            </div>

                                            <h5>Foto del vehículo</h5>

                                            <button class="btn btn-outline-success" type="button">
                                                <i class="bi bi-camera me-1" aria-hidden="true"></i>
                                                Abrir cámara
                                            </button>

                                            <label class="form-label mt-3 d-block" for="foto-vehiculo">
                                                Fotografía del vehículo
                                            </label>

                                            <input type="file" class="form-control selector-fotografia" id="foto-vehiculo"
                                                name="foto-vehiculo" accept="image/*">

                                        </div>
                                    </div>

                                </div>

                            </section>

                            <div class="mt-4">
                                <button class="btn btn-success px-4 boton-registrar" type="button">
                                    Registrar
                                </button>
                            </div>

                        </form>

                    </div>

                </section>

            </main>

            <!-- pie de página -->
            <footer class="pie-dashboard bg-white">
                <p>Sistema de Control de Acceso - SENA</p>
            </footer>

        </div>

    </div>

    <!-- archivos de navegación -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
