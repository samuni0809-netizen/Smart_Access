<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos - Control de Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS del Dashboard -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>

<body>

    <!-- ESTRUCTURA GENERAL DE LA APLICACIÓN -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- NAVEGACIÓN LATERAL COMPARTIDA -->
        <aside id="navegacion-header_vigilante"
            class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0"
            aria-label="Navegación principal">
        </aside>

        <div class="fondo-menu" id="fondo-menu"></div>

        <!-- CONTENIDO DERECHO -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- ENCABEZADO SUPERIOR -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button type="button" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3"
                    id="boton-menu" aria-label="Abrir menu" aria-expanded="false">

                    <i class="bi bi-list"></i>

                </button>

                <div class="informacion-pagina">

                    <h1 class="mb-1">Ingresos</h1>

                    <p class="mb-0">Panel de Vigilancia</p>

                </div>

            </header>

            <!-- CONTENIDO PRINCIPAL DEL DASHBOARD -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4 ">

                <!-- TÍTULO DEL PANEL -->
                <section class="encabezado-dashboard mb-4" aria-labelledby="titulo-panel-control">

                    <h2 id="titulo-panel-control" class="mb-1">
                        Panel de Control
                    </h2>

                    <p class="mb-0">
                        Miércoles, 11 de noviembre de 2026
                    </p>

                </section>

                <!-- TARJETAS ESTADÍSTICAS -->
                <section class="estadisticas-dashboard row row-cols-3 row-cols-lg-3 g-4"
                    aria-label="Resumen de estadísticas">

                    <!-- TARJETA DE ADMINISTRADORES -->
                    <div class="col">
                        <article
                            class="tarjeta-estadistica h-100 d-flex align-items-center justify-content-between gap-3 p-3 border rounded-4 bg-white">

                            <div class="informacion-estadistica flex-grow-1">

                                <h3>Administradores</h3>

                                <p class="valor-estadistica mb-0">5</p>

                            </div>

                            <div class="icono-estadistica d-flex align-items-center justify-content-center flex-shrink-0"
                                aria-hidden="true"><i class="bi bi-people"></i></div>

                            <div class="indicador-estadistica" aria-hidden="true"></div>

                            <div class="indicador-estadistica"></div>
                        </article>
                    </div>

                    <!-- TARJETA DE INGRESOS -->
                    <div class="col">
                        <article
                            class="tarjeta-estadistica h-100 d-flex align-items-center justify-content-between gap-3 p-3 border rounded-4 bg-white">

                            <div class="informacion-estadistica flex-grow-1">

                                <h3>Ingresos hoy</h3>

                                <p class="valor-estadistica mb-0">12</p>

                            </div>

                            <div class="icono-estadistica d-flex align-items-center justify-content-center flex-shrink-0"
                                aria-hidden="true"><i class="bi bi-people"></i></div>

                            <div class="indicador-estadistica" aria-hidden="true"></div>

                            <div class="indicador-estadistica"></div>
                        </article>
                    </div>

                    <!-- TARJETA DE SALIDAS -->
                    <div class="col">
                        <article
                            class="tarjeta-estadistica h-100 d-flex align-items-center justify-content-between gap-3 p-3 border rounded-4 bg-white">

                            <div class="informacion-estadistica flex-grow-1">

                                <h3>Salidas hoy</h3>

                                <p class="valor-estadistica mb-0">9</p>

                            </div>

                            <div class="icono-estadistica d-flex align-items-center justify-content-center flex-shrink-0"
                                aria-hidden="true"><i class="bi bi-people"></i></div>

                            <div class="indicador-estadistica" aria-hidden="true"></div>

                            <div class="indicador-estadistica"></div>
                        </article>
                    </div>

                </section>

                <!-- PANEL GENERAL DEL HISTORIAL -->
                <section class="panel-historial bg-white border rounded-4 p-3 p-md-4 mt-4"
                    aria-labelledby="titulo-historial">

                    <!-- TABLA DEL HISTORIAL -->
                    <div class="contenedor-tabla-registros table-responsive ">

                        <table class="tabla-ultimos-registros table table-hover align-middle mb-0">

                            <thead class="table-light text-center">

                                <tr>

                                    <th scope="col" class="text-nowrap">Movimiento</th>

                                    <th scope="col" class="text-nowrap">Fecha y hora</th>

                                    <th scope="col" class="text-nowrap">Computador</th>

                                    <th scope="col" class="text-nowrap">Vehículo</th>

                                    <th scope="col" class="text-nowrap">Estado de elementos</th>

                                    <th scope="col" class="text-nowrap">vigilante</th>

                                </tr>

                            </thead>


                            <tbody>

                                <!-- REGISTRO 1 -->
                                <tr>

                                    <td></td>

                                    <td>
                                    </td>

                                    <td>
                                    </td>

                                    <td></td>

                                    <td></td>

                                    <td>
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

            <!-- PIE DE PÁGINA -->
            <footer class="pie-dashboard bg-white">

                <p>Sistema de Control de Acceso - SENA</p>

            </footer>

        </div>

    </div>

    <!-- ARCHIVO DE NAVEGACIÓN COMPARTIDA -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
