<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario - Control de Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/registrar.css">
</head>

<body>
    <!-- ESTRUCTURA GENERAL -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- NAVEGACIÓN LATERAL -->
        <aside id="navegacion-header_vigilante" class="contenedor-navegacion sticky-top vh-100 align-self-start flex-shrink-0"
            aria-label="Navegación principal">
        </aside>

        <div class="fondo-menu" id="fondo-menu"></div>

        <!-- CONTENIDO DERECHO -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- ENCABEZADO -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <button type="button" class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3"
                    id="boton-menu" aria-label="Abrir menú" aria-expanded="false">

                    <i class="bi bi-list" aria-hidden="true"></i>

                </button>

                <div class="informacion-pagina">
                    <h1 class="mb-1">Registrar Usuario</h1>
                    <p class="mb-0">Panel Administrativo</p>
                </div>

            </header>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section>

                    <!-- TARJETA PRINCIPAL -->
                    <div class="card p-3 p-md-4">

                        <!-- FORMULARIO -->
                        <form id="formulario-temporal" aria-label="Registro temporal">

                            <h2 id="titulo-temporal" class="mb-4"> Registrar computador </h2>

                            <!-- REGISTRO DE DISPOSITIVO -->
                            <section class="mt-4" aria-labelledby="titulo-dispositivo">

                                <div class="row g-3">

                                    <div class="col-12 col-md-6">
                                        <label for="documento-propietario" class="form-label">
                                            Documento del propietario
                                        </label>
                                        <input type="text" class="form-control" id="documento-propietario"
                                            name="documento-propietario" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="marca-modelo" class="form-label">
                                            Marca / Modelo
                                        </label>
                                        <input type="text" class="form-control" id="marca-modelo"
                                            name="marca-modelo" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="numero-serial" class="form-label">
                                            Número de Serial
                                        </label>
                                        <input type="text" class="form-control" id="numero-serial"
                                            name="numero-serial" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="observaciones" class="form-label">
                                            Observaciones
                                        </label>
                                        <input type="text" class="form-control" id="observaciones"
                                            name="observaciones" placeholder="">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <div class="area-fotografia border rounded p-3 h-100 text-center">

                                            <div class="mb-2">
                                                <i class="bi bi-camera fs-2" aria-hidden="true"></i>
                                            </div>

                                            <h5>Foto del dispositivo</h5>

                                            <button type="button" class="btn btn-outline-success">
                                                <i class="bi bi-camera me-1" aria-hidden="true"></i>
                                                Abrir cámara
                                            </button>

                                            <label for="foto-dispositivo" class="form-label mt-3 d-block">
                                                Fotografía del dispositivo
                                            </label>

                                            <input type="file" class="form-control" id="foto-dispositivo"
                                                name="foto-dispositivo" accept="image/*" class="form-control selector-fotografia">

                                        </div>
                                    </div>

                                </div>

                            </section>

                            <div class="mt-4">
                                <button type="button" class="btn btn-success px-4 boton-registrar">
                                    Registrar
                                </button>
                            </div>

                        </form>

                    </div>

                </section>

            </main>

            <!-- PIE DE PÁGINA -->
            <footer class="pie-dashboard bg-white">
                <p>Sistema de Control de Acceso - SENA</p>
            </footer>

        </div>

    </div>

    <!-- ARCHIVOS DE NAVEGACIÓN -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
