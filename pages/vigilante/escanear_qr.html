<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos - Control de Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS del Dashboard -->
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/escanear-qr.css">
</head>

<body>

    <!-- ESTRUCTURA GENERAL DE LA APLICACIÓN -->
    <div class="estructura-administrativa d-flex min-vh-100">

        <!-- NAVEGACIÓN LATERAL COMPARTIDA -->
        <aside id="navegacion-header_vigilante" class="contenedor-navegacion sticky-top vh-100"
            aria-label="Navegación principal">
        </aside>

        <!-- FONDO OSCURO PARA CELULARES -->
        <div id="fondo-menu" class="fondo-menu"></div>


        <!-- CONTENIDO DERECHO -->
        <div class="contenido-aplicacion flex-grow-1">

            <!-- ENCABEZADO SUPERIOR -->
            <header class="encabezado-pagina d-flex align-items-center px-3 px-md-4 py-3">

                <!-- BOTÓN DEL MENÚ PARA CELULARES -->
                <button type="button" id="boton-menu"
                    class="boton-menu d-flex align-items-center justify-content-center d-md-none me-3"
                    aria-label="Abrir menú" aria-expanded="false">

                    <i class="bi bi-list"></i>

                </button>

                <!-- INFORMACIÓN DE LA PÁGINA -->
                <div class="informacion-pagina">

                    <h1 class="mb-1">Escanear QR</h1>

                    <p class="mb-0">Panel de Vigilancia</p>

                </div>

            </header>


            <!-- CONTENIDO PRINCIPAL -->
            <main class="contenido-dashboard container-fluid px-3 px-md-4 py-4">

                <section aria-labelledby="titulo-escanear-qr">
                    <header class="encabezado-escaner mb-4">
                        <h2 id="titulo-escanear-qr"> Escanear Código QR</h2>
                        <p>Escanea el QR del usuario para registrar ingreso o salida</p>
                    </header>

                    <div class="row g-4">

                        <div class="col-12 col-lg-7">
                            <article aria-label="Lector de código QR" class="tarjeta-lector">

                                <div class="area-escaneo">
                                    <i class="bi bi-qr-code-scan" aria-hidden="true"></i>
                                </div>

                                <h3>Apunta la cámara al código QR del usuario</h3>

                                <hr>

                                <p>Área de escaneo</p>
                            </article>
                        </div>

                        <div class="col-12 col-lg-5">
                            <article aria-label="Información del usuario" class="tarjeta-informacion">

                                <div class="icono-usuario">
                                    <i class="bi bi-person-fill" aria-hidden="true"></i>
                                </div>

                                <p>Escanea o ingresa un código QR para
                                    ver la información del usuario</p>
                            </article>
                        </div>


                    </div>

                    <section class="codigo-manual" aria-labelledby="titulo-codigo-manual">

                        <form class="formulario-codigo">

                            <div>
                                <label for="codigo-usuario">Código del Usuario</label>

                                <input type="text" id="codigo-usuario" name="codigo-usuario"
                                    placeholder="Ingrese el código">
                            </div>

                            <button type="button">Ingresar</button>
                        </form>
                    </section>
                </section>

            </main>

            <!-- PIE DE PÁGINA -->
            <footer class="pie-dashboard bg-white">

                <p>Sistema de Control de Acceso - SENA</p>

            </footer>

        </div>

    </div>

    <!-- ARCHIVO DE NAVEGACIÓN COMPARTIDA -->
    <script src="../../js/nav.js"></script>
    <script src="../../js/barra.js"></script>

</body>

</html>
