<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
</head>
<body>
    <div class="recuperar-contrasena">
        <section>
            <h2>Recuperar contraseña</h2>
            <h3>Valida tu cuenta y establece una nueva contraseña.</h3>

            <form action="" method="">

                <div class="confirmar-cuenta">
                    <label for="numero_documento">Número de documento</label>
                    <input type="text" name="numero_documento" id="numero_documento" placeholder="12233422">

                    <label for="correo_registrado">Correo electrónico registrado</label>
                    <input type="email" name="correo_registrado" id="correo_registrado" placeholder="correo@gmail.com">
                </div>

                <div class="nueva-contrasena">
                    <label for="nueva_contrasena">Nueva contraseña</label>
                    <input type="password"  name="nueva_contrasena" id="nueva_contrasena" placeholder="Mínimo 6 caracteres">
                    <label for="confirmar_contrasena">Confirmar nueva contraseña</label>
                    <input type="password" name="confirmar_contrasena" id="confirmar_contrasena" placeholder="Repite la nueva contraseña">
                </div>

                <button type="submit" class="verificar-cuenta">
                    Verificar cuenta
                </button>

            </form>

            <a href="../Smart_Access/index.html" class="volver-inicio">
                Volver al inicio
            </a>
        </section>
    </div>
</body>
</html>
