<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Computador | Panel Administrativo - SENA </title>
    <link rel="stylesheet" href="#">
</head>

<body>

    <!-- NAVEGACIÓN COMPARTIDA ENTRE PÁGINAS  -->

    <header>
        <div id="navegacion-header_celador"></div>

        <div>
            <button>
                <p>Este es el boton para abrir la barra de navegacion</p>
            </button>
            <div>
                <h1>Registrar Computador</h1>
                <p>Panel Administrativo</p>
            </div>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->

    <main>

        <h2>Registrar computador</h2>

        <form action="#">
            <div>
                <label>Documento del propietario</label>
                <input type="number">
            </div>

            <div>
                <label>Marca / Modelo</label>
                <input type="text">
            </div>

            <div>
                <label>Serial</label>
                <input type="text">
            </div>

            <div>
                <label>Detalles</label>
                <input type="text">
            </div>

            <fieldset>
                <legend>Computador</legend>

                <div>
                    <p>Foto del computador</p>
                    <button type="button">Abrir Cámara</button>
                </div>
            </fieldset>

            <!-- BOTÓN DE ENVÍO -->
            <div>
                <button type="submit">Registrar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>informacion del footer</p>
    </footer>
</body>

<!-- ENLACES JS PARA EL FUNCIONAMIENTO DE LA PÁGINA -->

<script src="../../js/nav.js"></script>

</html>
